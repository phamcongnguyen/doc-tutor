services:
  doctutor:
    build:
      # Build context là repo root để Dockerfile COPY được code + requirements
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    environment:
      # Ollama chạy native trên máy host (macOS cần Metal GPU, Docker không có) —
      # thư viện ollama-python tự đọc biến này, không cần sửa code.
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      # Persist vector index ra ngoài container (T0.5) — trùng đường dẫn
      # chroma_db mà doctutor/config.py neo theo repo root (/app).
      - ../chroma_db:/app/chroma_db
    extra_hosts:
      # Để host.docker.internal hoạt động cả trên Linux (macOS có sẵn)
      - "host.docker.internal:host-gateway"
